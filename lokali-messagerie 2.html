<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LOKALI MESSAGERIE</title>
<style>
:root{
  --orange:#F97316;--orange2:#FB923C;--green:#059669;
  --dark:#F1F5F9;--dark2:#FFFFFF;--dark3:#E2E8F0;
  --card:#FFFFFF;--border:rgba(15,23,42,.10);
  --white:#1E293B;--gray:#64748B;--radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--dark);color:var(--white);padding-bottom:20px}
.nav{position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);
  box-shadow:0 2px 12px rgba(15,23,42,.06);padding:10px 16px;min-height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--white);font-size:18px;font-weight:900}
.nav-logo b{color:var(--orange)}
.nav-back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--white);text-decoration:none;
  background:rgba(15,23,42,.08);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding:80px 16px 20px}
h1{font-size:22px;margin-bottom:16px}
.empty{color:var(--gray);font-size:13px;text-align:center;padding:24px 0}

.conv-item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer}
.conv-item:hover{border-color:var(--orange)}
.conv-badge{font-size:10px;font-weight:800;background:rgba(249,115,22,.12);color:var(--orange2);
  border-radius:20px;padding:3px 9px;display:inline-block;margin-bottom:4px}
.conv-titre{font-size:14px;font-weight:700}
.conv-dernier{font-size:12px;color:var(--gray);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-non-lu{width:9px;height:9px;border-radius:50%;background:var(--orange);flex-shrink:0}

#vueConversation{display:none}
.chat-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.chat-back{background:rgba(15,23,42,.06);border:none;border-radius:20px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--white)}
.chat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;height:50vh;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.msg-bulle{max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4}
.msg-moi{align-self:flex-end;background:var(--orange);color:#fff;border-bottom-right-radius:4px}
.msg-autre{align-self:flex-start;background:rgba(15,23,42,.06);color:var(--white);border-bottom-left-radius:4px}
.msg-heure{font-size:10px;opacity:.7;margin-top:4px}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1;padding:12px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--white);font-size:14px}
.chat-input-row button{background:var(--orange);color:#fff;border:none;border-radius:20px;padding:12px 20px;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-logo">LOKALI <b>MESSAGERIE</b></span>
  <a class="nav-back" href="/lokali-hub.html">‹ Opportunités</a>
</nav>

<div class="wrap">
  <h1>Mes conversations</h1>

  <div id="vueListe">
    <div id="listeConversations"><div class="empty">Chargement...</div></div>
  </div>

  <div id="vueConversation">
    <div class="chat-header">
      <button class="chat-back" onclick="retourListe()">‹ Retour</button>
      <div>
        <div class="conv-badge" id="chatBadge"></div>
        <div style="font-weight:800" id="chatTitre"></div>
      </div>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input-row">
      <input id="chatInput" placeholder="Écris ton message..." onkeydown="if(event.key==='Enter')envoyerMessage()">
      <button onclick="envoyerMessage()">Envoyer</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SUPA_URL = "https://qmwdneqxyyvrcrseudwt.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2RuZXF4eXl2cmNyc2V1ZHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDIwMDEsImV4cCI6MjA5ODIxODAwMX0.pQIxHsk080-SY-eeG268zS-uhJHuFQv6QE6pcH5vBB8";
var _supabase = supabase.createClient(SUPA_URL, SUPA_KEY);
var _userId = null;
var _conversationActive = null;
var _autreParticipant = null;

var LABELS_MODULE = {
  mission: "📋 Mission", emploi: "💼 Emploi", marche: "🛒 Marché",
  partenariat: "🤝 Partenariat", projet: "🚀 Projet", appel_offres: "📄 Appel d'offres", invest: "💰 Investissement"
};

async function initSession() {
  var res = await _supabase.auth.getSession();
  var session = res && res.data ? res.data.session : null;
  if (!session) {
    document.body.innerHTML = '<div style="padding:100px 20px;text-align:center"><h2>Connexion requise</h2><p style="color:#64748B;margin-top:10px">Connecte-toi depuis LOKALI pour voir tes messages.</p><a href="/" style="display:inline-block;margin-top:16px;background:#F97316;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;font-weight:700">Aller me connecter</a></div>';
    return;
  }
  _userId = session.user.id;

  var params = new URLSearchParams(window.location.search);
  var convId = params.get("conversation");
  chargerListe();
  if (convId) ouvrirConversationParId(convId);
}

async function chargerListe() {
  var el = document.getElementById("listeConversations");
  var r = await _supabase.from("lokt_conversations").select("*")
    .or("participant_1.eq." + _userId + ",participant_2.eq." + _userId)
    .order("created_at", { ascending: false });
  if (r.error || !r.data || !r.data.length) { el.innerHTML = '<div class="empty">Aucune conversation pour le moment.</div>'; return; }

  el.innerHTML = "";
  for (var i = 0; i < r.data.length; i++) {
    var conv = r.data[i];
    var dm = await _supabase.from("lokt_messages").select("*").eq("conversation_id", conv.id).order("created_at", { ascending: false }).limit(1);
    var dernier = (dm.data && dm.data[0]) ? dm.data[0].contenu : "Nouvelle conversation";
    var nonLu = dm.data && dm.data[0] && !dm.data[0].lu && dm.data[0].expediteur_id !== _userId;
    var div = document.createElement("div");
    div.className = "conv-item";
    div.innerHTML =
      '<div style="flex:1">' +
      '<div class="conv-badge">' + (LABELS_MODULE[conv.contexte_module] || conv.contexte_module) + '</div>' +
      '<div class="conv-titre">' + (conv.contexte_titre || "Discussion") + '</div>' +
      '<div class="conv-dernier">' + dernier + '</div>' +
      '</div>' +
      (nonLu ? '<div class="conv-non-lu"></div>' : '');
    div.addEventListener("click", function(c){ return function(){ ouvrirConversation(c); }; }(conv));
    el.appendChild(div);
  }
}

async function ouvrirConversationParId(convId) {
  var r = await _supabase.from("lokt_conversations").select("*").eq("id", convId).maybeSingle();
  if (r.data) ouvrirConversation(r.data);
}

async function ouvrirConversation(conv) {
  _conversationActive = conv;
  _autreParticipant = (conv.participant_1 === _userId) ? conv.participant_2 : conv.participant_1;
  document.getElementById("vueListe").style.display = "none";
  document.getElementById("vueConversation").style.display = "";
  document.getElementById("chatBadge").textContent = LABELS_MODULE[conv.contexte_module] || conv.contexte_module;
  document.getElementById("chatTitre").textContent = conv.contexte_titre || "Discussion";
  await chargerMessages();
  await _supabase.from("lokt_messages").update({ lu: true }).eq("conversation_id", conv.id).neq("expediteur_id", _userId);
}

function retourListe() {
  document.getElementById("vueConversation").style.display = "none";
  document.getElementById("vueListe").style.display = "";
  chargerListe();
}

async function chargerMessages() {
  var box = document.getElementById("chatBox");
  var r = await _supabase.from("lokt_messages").select("*").eq("conversation_id", _conversationActive.id).order("created_at", { ascending: true });
  if (!r.data) { box.innerHTML = ""; return; }
  box.innerHTML = r.data.map(function(m) {
    var moi = m.expediteur_id === _userId;
    var heure = new Date(m.created_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    return '<div class="msg-bulle ' + (moi ? "msg-moi" : "msg-autre") + '">' + m.contenu + '<div class="msg-heure">' + heure + '</div></div>';
  }).join("");
  box.scrollTop = box.scrollHeight;
}

async function envoyerMessage() {
  var input = document.getElementById("chatInput");
  var texte = input.value.trim();
  if (!texte || !_conversationActive) return;
  var ins = await _supabase.from("lokt_messages").insert({
    conversation_id: _conversationActive.id, expediteur_id: _userId, contenu: texte
  });
  if (ins.error) { alert("Erreur : " + ins.error.message); return; }
  input.value = "";
  chargerMessages();
}

initSession();
</script>
</body>
</html>
