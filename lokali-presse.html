<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="description" content="Actualités, conseils et succès des utilisateurs LOKALI, la plateforme 100% gratuite en Afrique francophone.">
<title>LOKALI — Presse & Actualités</title>
<style>
:root{
  --orange:#F97316;--green:#059669;
  --card:#FFFFFF;--border:rgba(15,23,42,.10);
  --white:#1E293B;--gray:#64748B;--radius:20px;
  --gradient:linear-gradient(135deg,#F8FAFC 0%,#F1F5F9 50%,#E2E8F0 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--gradient);background-attachment:fixed;
  color:var(--white);min-height:100vh;padding-bottom:40px}
.nav{position:sticky;top:0;z-index:999;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);box-shadow:0 2px 12px rgba(15,23,42,.06);
  border-bottom:1px solid rgba(15,23,42,.06);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--white);font-size:18px;font-weight:900}
.nav-logo b{color:var(--orange)}
.nav-back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--white);text-decoration:none;
  background:rgba(15,23,42,.08);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-weight:600}
.hero{text-align:center;padding:32px 20px 10px}
.hero h1{font-size:23px;font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,#1E293B,#EA580C);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--gray);font-size:14px;max-width:440px;margin:0 auto}
.tabs{max-width:640px;margin:20px auto 0;padding:0 16px;display:flex;gap:8px}
.tab{flex:1;text-align:center;padding:10px;border-radius:20px;font-weight:800;font-size:12.5px;
  background:var(--card);border:1px solid var(--border);color:var(--gray);cursor:pointer}
.tab.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.wrap{max-width:640px;margin:20px auto 0;padding:0 16px}
.article{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}
.article .tag{display:inline-block;font-size:10.5px;font-weight:800;color:var(--orange);
  background:rgba(249,115,22,.1);border-radius:20px;padding:3px 10px;margin-bottom:8px}
.article h3{font-size:15px;margin-bottom:6px}
.article p{font-size:12.5px;color:var(--gray);line-height:1.5}
.article .date{font-size:11px;color:var(--gray);margin-top:8px;display:block}
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-logo">LOKALI <b>PRESSE</b></span>
  <a class="nav-back" href="/lokali-hub.html">‹ LOKALI</a>
</nav>

<div class="hero">
  <h1>LOKALI dans les médias</h1>
  <p>Actualités, conseils pratiques et succès de notre communauté d'utilisateurs.</p>
</div>

<div class="tabs">
  <div class="tab active" onclick="filtrer('tous', this)">Tout</div>
  <div class="tab" onclick="filtrer('actualite', this)">Actualités</div>
  <div class="tab" onclick="filtrer('conseil', this)">Conseils</div>
  <div class="tab" onclick="filtrer('succes', this)">Succès</div>
</div>

<div class="wrap" id="articlesZone"></div>

<script>
var articles = [
  { cat: "actualite", tag: "Actualité", titre: "LOKALI franchit une nouvelle étape de croissance", texte: "De nouvelles villes rejoignent la plateforme chaque mois, avec toujours plus de talents et d'opportunités partagées gratuitement.", date: "Juillet 2026" },
  { cat: "conseil", tag: "Conseil", titre: "5 astuces pour un profil qui attire les bons contacts", texte: "Une photo claire, une description précise de vos compétences et une disponibilité à jour font toute la différence sur LOKALI.", date: "Juillet 2026" },
  { cat: "succes", tag: "Succès", titre: "Comment un artisan local a trouvé 10 nouveaux clients via LOKALI", texte: "Témoignage d'un prestataire qui a développé son activité grâce à la visibilité gratuite offerte par la plateforme.", date: "Juin 2026" },
  { cat: "conseil", tag: "Conseil", titre: "Pourquoi le badge de vérification renforce la confiance", texte: "Les profils vérifiés reçoivent en moyenne plus de contacts. Voici comment obtenir le vôtre gratuitement.", date: "Juin 2026" },
  { cat: "actualite", tag: "Actualité", titre: "LOKALI lance son espace dédié aux sponsors et partenaires", texte: "Une nouvelle façon pour les entreprises de soutenir l'écosystème tout en gagnant en visibilité auprès d'une audience active.", date: "Juin 2026" }
];

function rendre(liste) {
  document.getElementById("articlesZone").innerHTML = liste.map(function(a){
    return '<div class="article">' +
      '<span class="tag">' + a.tag + '</span>' +
      '<h3>' + a.titre + '</h3>' +
      '<p>' + a.texte + '</p>' +
      '<span class="date">' + a.date + '</span>' +
    '</div>';
  }).join("");
}

function filtrer(cat, el) {
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
  el.classList.add("active");
  rendre(cat === "tous" ? articles : articles.filter(function(a){ return a.cat === cat; }));
}

rendre(articles);
</script>
</body>
</html>
