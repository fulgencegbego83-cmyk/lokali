<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LOKALI — Avis & Confiance</title>
<style>
:root{
  --orange:#F97316;--green:#059669;
  --card:#FFFFFF;--border:rgba(15,23,42,.10);
  --white:#1E293B;--gray:#64748B;--radius:20px;
  --gradient:linear-gradient(135deg,#F8FAFC 0%,#F1F5F9 50%,#E2E8F0 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--gradient);background-attachment:fixed;
  color:var(--white);min-height:100vh;padding-bottom:40px}
.nav{position:sticky;top:0;z-index:999;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);box-shadow:0 2px 12px rgba(15,23,42,.06);
  border-bottom:1px solid rgba(15,23,42,.06);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--white);font-size:18px;font-weight:900}
.nav-logo b{color:var(--orange)}
.nav-back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--white);text-decoration:none;
  background:rgba(15,23,42,.08);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-weight:600}
.hero{text-align:center;padding:30px 20px 10px}
.hero h1{font-size:22px;font-weight:900}
.confiance-stars{font-size:18px;letter-spacing:3px;color:#FACC15}
.confiance-note-txt{font-size:12px;color:var(--gray);margin-left:4px;display:block;margin-top:4px}
.badgeZone{max-width:640px;margin:16px auto;padding:0 16px;text-align:center}
.avis-liste{max-width:640px;margin:16px auto;padding:0 16px}
.avis-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.avis-item .contexte{font-weight:800;font-size:13px}
.avis-item .stars{color:#FACC15;font-size:13px}
.avis-item .commentaire{font-size:12.5px;color:var(--gray);margin-top:4px;line-height:1.4}
.avis-item .date{font-size:10.5px;color:var(--gray);margin-top:4px}
.section-title{max-width:640px;margin:26px auto 4px;padding:0 20px;font-size:13px;font-weight:800;
  color:var(--gray);text-transform:uppercase;letter-spacing:1px}
.avis-vide{text-align:center;color:var(--gray);font-size:13px;padding:20px}
.info-box{max-width:640px;margin:16px auto;padding:0 16px}
.info-box-inner{background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.25);border-radius:14px;
  padding:12px 16px;font-size:12px;color:var(--gray);line-height:1.5}
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-logo"><img src="/lokali-logo-nav.svg" alt="LOKALI" style="height:26px;margin-right:6px"><b>CONFIANCE</b></span>
  <a class="nav-back" href="/lokali-hub.html">‹ LOKALI</a>
</nav>

<div class="hero">
  <h1 id="titrePage">Avis & Confiance</h1>
</div>

<div class="badgeZone" id="confianceBadgeZone"></div>

<div class="section-title">Avis reçus</div>
<div class="avis-liste" id="avisListe"></div>

<div class="info-box">
  <div class="info-box-inner">
    💡 Pour laisser un avis à quelqu'un après une collaboration (mission, emploi, marché...), rends-toi sur la page
    <a href="/lokali-communaute.html" style="color:var(--orange);font-weight:700;text-decoration:none">Communauté</a>,
    onglet "Laisser un avis".
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SUPA_URL = "https://qmwdneqxyyvrcrseudwt.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2RuZXF4eXl2cmNyc2V1ZHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDIwMDEsImV4cCI6MjA5ODIxODAwMX0.pQIxHsk080-SY-eeG268zS-uhJHuFQv6QE6pcH5vBB8";
var _supabase = supabase.createClient(SUPA_URL, SUPA_KEY);

var params = new URLSearchParams(window.location.search);
var ID_CIBLE = params.get("id");
var NOM_CIBLE = params.get("nom") || "";

async function resoudreCible() {
  if (ID_CIBLE) return ID_CIBLE;
  var res = await _supabase.auth.getSession();
  var session = res && res.data ? res.data.session : null;
  return session ? session.user.id : null;
}

async function chargerConfiance() {
  var idCible = await resoudreCible();
  if (!idCible) {
    document.getElementById("confianceBadgeZone").innerHTML = '<div class="avis-vide">Connecte-toi depuis LOKALI, ou ouvre cette page avec ?id=... pour voir les avis de quelqu\'un.</div>';
    return;
  }

  if (NOM_CIBLE) document.getElementById("titrePage").textContent = "Avis — " + NOM_CIBLE;

  try {
    var avis = await _supabase.from("lokt_avis_utilisateur").select("*")
      .eq("evalue_id", idCible)
      .order("created_at", { ascending: false });

    var liste = avis.data || [];
    var moyenne = liste.length ? (liste.reduce(function(s,a){return s+a.note;},0) / liste.length) : 0;
    var moyArrondie = Math.round(moyenne);

    document.getElementById("confianceBadgeZone").innerHTML =
      '<div><span class="confiance-stars">' + "★".repeat(moyArrondie) + "☆".repeat(5-moyArrondie) + '</span>' +
      '<span class="confiance-note-txt">' + (liste.length ? moyenne.toFixed(1) + '/5 · ' + liste.length + ' avis' : 'Aucun avis pour le moment') + '</span></div>';

    document.getElementById("avisListe").innerHTML = liste.length ? liste.map(function(a){
      var date = new Date(a.created_at).toLocaleDateString('fr-FR');
      return '<div class="avis-item">' +
        '<span class="stars">' + "★".repeat(a.note) + "☆".repeat(5-a.note) + '</span> ' +
        (a.contexte_module ? '<span class="contexte">' + a.contexte_module + '</span>' : '') +
        (a.commentaire ? '<div class="commentaire">' + a.commentaire + '</div>' : '') +
        '<div class="date">' + date + '</div>' +
      '</div>';
    }).join("") : '<div class="avis-vide">Aucun avis pour le moment.</div>';
  } catch(e) {
    document.getElementById("avisListe").innerHTML = '<div class="avis-vide">Impossible de charger les avis pour le moment.</div>';
  }
}

chargerConfiance();
</script>
<script src="/lokali-widgets-unifie.js"></script>
<script src="/lokali-bandeau-sponsors.js"></script>
</body>
</html>
