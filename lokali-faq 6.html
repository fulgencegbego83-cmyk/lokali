es signalements en priorité."}}, {"@type": "Question", "name": "Comment contacter un prestataire ?", "acceptedAnswer": {"@type": "Answer", "text": "Directement depuis son profil : WhatsApp, appel ou messagerie interne, selon ce que le prestataire a activé, sans aucun frais."}}, {"@type": "Question", "name": "LOKALI fonctionne-t-il sur mobile ?", "acceptedAnswer": {"@type": "Answer", "text": "Oui, LOKALI est optimisé mobile, tablette et desktop, et peut être installé comme une application (PWA) depuis votre navigateur."}}, {"@type": "Question", "name": "Puis-je utiliser LOKALI dans plusieurs villes ou pays ?", "acceptedAnswer": {"@type": "Answer", "text": "Oui, la plateforme couvre plusieurs villes et s'étend progressivement à toute l'Afrique francophone."}}]}</script>

<div class="hero">
  <h1>Questions fréquentes</h1>
  <p>Tout ce qu'il faut savoir sur LOKALI, en toute transparence.</p>
</div>

<div class="banner">
  <div class="banner-inner">✅ LOKALI est et restera 100% gratuit pour tous les utilisateurs — pas d'abonnement, pas de commission, pas de piège.</div>
</div>

<div class="section-title">Gratuité & modèle économique</div>
<div class="wrap" id="grp1"></div>

<div class="section-title">Sécurité & confiance</div>
<div class="wrap" id="grp2"></div>

<div class="section-title">Utilisation</div>
<div class="wrap" id="grp3"></div>

<script>
var faqGroups = {
  grp1: [
    { q: "Pourquoi LOKALI est-il gratuit ?", a: "Parce que LOKALI est financé uniquement par des sponsors et partenaires (entreprises, banques, opérateurs télécoms, ONG, institutions) qui paient pour de la visibilité. Aucun coût n'est jamais reporté sur les utilisateurs, quelle que soit la fonctionnalité." },
    { q: "Est-ce que ça restera gratuit dans le futur ?", a: "Oui. La gratuité est une règle fondatrice de LOKALI : inscription, publication, recherche, messagerie, badge de vérification et toutes les futures fonctionnalités resteront toujours accessibles sans frais." },
    { q: "Comment devenir sponsor ou partenaire ?", a: "Rendez-vous sur la page dédiée « Devenir Sponsor », choisissez la formule adaptée (Local, Régional, National, Continental ou Institutionnel) et remplissez le formulaire de candidature. Notre équipe vous recontacte rapidement." }
  ],
  grp2: [
    { q: "Comment fonctionne la vérification des profils ?", a: "Chaque prestataire peut obtenir un badge de vérification après contrôle de ses informations. Ce badge est gratuit et aide les utilisateurs à identifier les profils fiables." },
    { q: "Comment mes données sont-elles protégées ?", a: "Vos données ne sont jamais vendues à des tiers. Elles servent uniquement à faire fonctionner la plateforme (mise en relation, statistiques anonymisées pour les sponsors)." },
    { q: "Comment signaler un problème ou un profil suspect ?", a: "Un bouton de signalement est disponible sur chaque profil et chaque annonce. Notre équipe traite les signalements en priorité." }
  ],
  grp3: [
    { q: "Comment contacter un prestataire ?", a: "Directement depuis son profil : WhatsApp, appel ou messagerie interne, selon ce que le prestataire a activé, sans aucun frais." },
    { q: "LOKALI fonctionne-t-il sur mobile ?", a: "Oui, LOKALI est optimisé mobile, tablette et desktop, et peut être installé comme une application (PWA) depuis votre navigateur." },
    { q: "Puis-je utiliser LOKALI dans plusieurs villes ou pays ?", a: "Oui, la plateforme couvre plusieurs villes et s'étend progressivement à toute l'Afrique francophone." }
  ]
};

function renderGroup(id) {
  document.getElementById(id).innerHTML = faqGroups[id].map(function(item, i){
    return '<div class="faq-item" id="' + id + '-' + i + '">' +
      '<div class="faq-q" onclick="toggleFaq(\'' + id + '\',' + i + ')">' +
        '<span>' + item.q + '</span><span class="arrow">▾</span>' +
      '</div>' +
      '<div class="faq-a"><div class="faq-a-inner">' + item.a + '</div></div>' +
    '</div>';
  }).join("");
}
Object.keys(faqGroups).forEach(renderGroup);

function toggleFaq(id, i) {
  document.getElementById(id + '-' + i).classList.toggle('open');
}
</script>
