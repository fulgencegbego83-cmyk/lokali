<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Devis / Facture — LOKALI</title>
<meta name="description" content="Consulte un devis ou une facture partagé sur LOKALI.">
<link rel="canonical" href="https://mylokali.com/lokali-devis-facture.html">
<style>
:root{
  --orange:#F97316;--orange2:#FB923C;--orange-txt:#C2410C;
  --dark:#F1F5F9;--card:#FFFFFF;--border:rgba(15,23,42,.10);
  --white:#1E293B;--gray:#64748B;--radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--dark);color:var(--white);padding-bottom:60px}
.nav{position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(15,23,42,.06);padding:10px 16px;min-height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--white);font-size:18px;font-weight:900}
.wrap{max-width:900px;margin:0 auto;padding:80px 16px 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:14px;text-align:center}
.btn{display:inline-block;background:var(--orange);color:#fff;border:none;border-radius:30px;
  padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px;text-decoration:none}
.btn:hover{background:var(--orange2)}
.empty{color:var(--gray);font-size:13px;text-align:center;padding:24px 0}
#docApercu{background:#fff;border-radius:var(--radius);box-shadow:0 4px 24px rgba(15,23,42,.08);
  max-width:760px;margin:0 auto;overflow:hidden;color:#1E293B;--doc-accent:#F97316}
.doc-header{padding:30px 32px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--doc-accent)}
.doc-titre-type{font-size:26px;font-weight:900;color:#1E293B}
.doc-numero{font-size:13px;color:#64748B;margin-top:4px}
.doc-marque{font-size:18px;font-weight:900;text-align:right}
.doc-marque span{color:var(--doc-accent)}
.doc-body{padding:24px 32px}
.doc-parties{display:flex;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.doc-partie{flex:1;min-width:200px}
.doc-partie-titre{font-size:11px;font-weight:800;text-transform:uppercase;color:#94A3B8;margin-bottom:6px}
.doc-partie b{font-size:14px;display:block;margin-bottom:2px}
.doc-partie span{font-size:12px;color:#475569;display:block}
table.doc-table{width:100%;border-collapse:collapse;margin-bottom:20px}
table.doc-table th{background:var(--doc-accent);color:#fff;font-size:12px;padding:9px 10px;text-align:left}
table.doc-table td{padding:9px 10px;font-size:13px;border-bottom:1px solid #F1F5F9}
table.doc-table th:last-child, table.doc-table td:last-child{text-align:right}
.doc-totaux{margin-left:auto;width:260px}
.doc-totaux .ligne{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.doc-totaux .total-final{font-weight:900;font-size:16px;border-top:2px solid #1E293B;padding-top:8px;margin-top:4px}
.doc-notes{font-size:12px;color:#475569;background:#F8FAFC;padding:12px;border-radius:10px;margin-top:16px}
.doc-footer{border-top:1px solid #E2E8F0;padding:14px 32px;font-size:11px;color:#94A3B8}
@media print { .nav, .btn, .no-print { display:none !important; } body { background:#fff; padding:0 } #docApercu { box-shadow:none; max-width:100% } .wrap{padding:0} }
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-logo"><img src="/lokali-logo-v2.svg" alt="LOKALI" style="height:26px"></span>
  <a class="nav-logo" href="/" style="font-size:13px">Accueil ›</a>
</nav>

<div class="wrap">
  <div id="zoneConnexionRequise" class="card" style="display:none">
    <div style="font-size:32px;margin-bottom:10px">🔒</div>
    <h2 style="margin-bottom:8px">Connexion requise</h2>
    <p style="font-size:13px;color:var(--gray);margin-bottom:4px">Ce document est réservé aux membres de LOKALI.</p>
    <p style="font-size:13px;color:var(--gray)">Connecte-toi ou crée un compte gratuitement (par email ou numéro de téléphone) pour le consulter.</p>
    <a class="btn" href="/?action=inscription">Se connecter / Créer un compte</a>
  </div>

  <div id="zoneDoc" style="display:none">
    <div class="no-print" style="text-align:center;margin-bottom:16px">
      <button class="btn" onclick="window.print()">🖨️ Télécharger en PDF</button>
      <button class="btn" style="background:rgba(15,23,42,.08);color:var(--white)" onclick="partagerDocument()">📤 Partager</button>
    </div>
    <div id="docApercu"><div class="empty">Chargement...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SUPA_URL = "https://qmwdneqxyyvrcrseudwt.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2RuZXF4eXl2cmNyc2V1ZHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDIwMDEsImV4cCI6MjA5ODIxODAwMX0.pQIxHsk080-SY-eeG268zS-uhJHuFQv6QE6pcH5vBB8";
var _supabase = supabase.createClient(SUPA_URL, SUPA_KEY);

function partagerDocument() {
  var params = new URLSearchParams(window.location.search);
  var id = params.get("voir");
  var url = window.location.origin + "/lokali-devis-facture.html?voir=" + id;
  var texte = "📄 Voici mon document, généré via LOKALI";
  if (navigator.share) {
    navigator.share({ title: "Document LOKALI", text: texte, url: url }).catch(function(err){
      if (err && err.name === "AbortError") return;
      window.open("https://wa.me/?text=" + encodeURIComponent(texte + " : " + url), "_blank");
    });
  } else {
    window.open("https://wa.me/?text=" + encodeURIComponent(texte + " : " + url), "_blank");
  }
}

function rendreApercu(d) {
  var lignes = d.lignes || [];
  var sousTotal = lignes.reduce(function(s, l){ return s + (l.quantite * l.prix_unitaire); }, 0);
  var remise = sousTotal * ((d.remise_pourcentage || 0) / 100);
  var total = sousTotal - remise;
  var estFacture = d.type_document === "facture";
  var LABELS_TITRE_DF = { devis: "DEVIS", facture: "FACTURE", proforma: "FACTURE PRO FORMA" };

  var html = '<div class="doc-header">' +
    '<div><div class="doc-titre-type">' + (LABELS_TITRE_DF[d.type_document] || "DEVIS") + '</div><div class="doc-numero">N° ' + d.numero + ' · ' + new Date(d.date_emission || d.created_at).toLocaleDateString("fr-FR") + '</div></div>' +
    '<div>' + (d.emetteur_logo ? '<img src="' + d.emetteur_logo + '" style="max-width:120px;max-height:60px;object-fit:contain;margin-bottom:6px">' : '') + '<div class="doc-marque">LOKALI<span>.</span></div></div>' +
    '</div>';
  html += '<div class="doc-body">';
  html += '<div class="doc-parties">' +
    '<div class="doc-partie"><div class="doc-partie-titre">Émetteur</div><b>' + (d.emetteur_nom || "—") + '</b>' +
    (d.emetteur_activite ? '<span>' + d.emetteur_activite + '</span>' : '') +
    (d.emetteur_ville ? '<span>' + d.emetteur_ville + '</span>' : '') +
    (d.emetteur_telephone ? '<span>' + d.emetteur_telephone + '</span>' : '') + '</div>' +
    '<div class="doc-partie"><div class="doc-partie-titre">Client</div><b>' + d.client_nom + '</b>' +
    (d.client_telephone ? '<span>' + d.client_telephone + '</span>' : '') +
    (d.client_email ? '<span>' + d.client_email + '</span>' : '') + '</div>' +
    '</div>';
  html += '<table class="doc-table"><thead><tr><th>Désignation</th><th>Qté</th><th>Prix unitaire</th><th>Total</th></tr></thead><tbody>';
  lignes.forEach(function(l){
    html += '<tr><td>' + l.designation + '</td><td>' + l.quantite + '</td><td>' + l.prix_unitaire.toLocaleString("fr-FR") + ' FCFA</td><td>' + (l.quantite * l.prix_unitaire).toLocaleString("fr-FR") + ' FCFA</td></tr>';
  });
  html += '</tbody></table>';
  html += '<div class="doc-totaux">' +
    '<div class="ligne"><span>Sous-total</span><span>' + sousTotal.toLocaleString("fr-FR") + ' FCFA</span></div>' +
    (d.remise_pourcentage > 0 ? '<div class="ligne"><span>Remise (' + d.remise_pourcentage + '%)</span><span>-' + remise.toLocaleString("fr-FR") + ' FCFA</span></div>' : '') +
    '<div class="ligne total-final"><span>Total ' + (estFacture ? "à payer" : "estimé") + '</span><span>' + total.toLocaleString("fr-FR") + ' FCFA</span></div>' +
    '</div>';
  var notesBlock = "";
  if (d.conditions_paiement) notesBlock += (estFacture ? "Conditions de paiement : " : "Délai de validité : ") + d.conditions_paiement + "<br>";
  if (d.notes) notesBlock += d.notes;
  if (notesBlock) html += '<div class="doc-notes">' + notesBlock + '</div>';
  html += '</div>';
  var lienVerif = window.location.origin + "/lokali-devis-facture.html?voir=" + d.id;
  html += '<div class="doc-footer">Document généré via LOKALI · Réf. ' + d.numero + ' · Vérifiable sur ' + lienVerif + '</div>';
  document.getElementById("docApercu").innerHTML = html;
  document.getElementById("docApercu").style.setProperty("--doc-accent", d.couleur_accent || "#F97316");
}

async function initSession() {
  var params = new URLSearchParams(window.location.search);
  var idConsulte = params.get("voir");
  if (!idConsulte) { window.location.href = "/lokali-prestataires.html#devisfacture"; return; }

  var res = await _supabase.auth.getSession();
  var session = res && res.data ? res.data.session : null;

  // Connexion obligatoire pour consulter, quel que soit le document.
  if (!session) {
    document.getElementById("zoneConnexionRequise").style.display = "";
    return;
  }

  var r = await _supabase.from("lokt_devis_facture").select("*").eq("id", idConsulte).maybeSingle();
  document.getElementById("zoneDoc").style.display = "";
  if (!r.data) {
    document.getElementById("docApercu").innerHTML = '<div class="empty" style="padding:40px 0">Ce document est introuvable ou n\'est plus disponible.</div>';
    return;
  }
  rendreApercu(r.data);
}

initSession();
</script>
</body>
</html>
