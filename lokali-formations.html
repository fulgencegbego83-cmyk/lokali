<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LOKALI FORMATIONS — Montez en compétence</title>
<style>
:root{
  --orange:#F97316;--orange2:#FB923C;--green:#059669;
  --dark:#F1F5F9;--dark2:#FFFFFF;--dark3:#E2E8F0;
  --card:#FFFFFF;--border:rgba(15,23,42,.10);
  --white:#1E293B;--gray:#64748B;--radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--dark);color:var(--white);padding-bottom:60px}
.nav{position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);box-shadow:0 2px 12px rgba(15,23,42,.06);
  border-bottom:1px solid rgba(15,23,42,.06);padding:10px 16px;min-height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--white);font-size:18px;font-weight:900}
.nav-logo b{color:var(--orange)}
.nav-back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--white);text-decoration:none;
  background:rgba(15,23,42,.08);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-weight:600}
.nav-back:hover{background:rgba(15,23,42,.14)}
.wrap{max-width:640px;margin:0 auto;padding:80px 16px 20px}
h1{font-size:22px;margin-bottom:4px}
.subtitle{color:var(--gray);font-size:14px;margin-bottom:12px}
.stats-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat-pill{font-size:11px;font-weight:800;color:#34D399;background:rgba(5,150,105,.15);border-radius:20px;padding:4px 12px}
.tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:10px 4px;font-size:14px;font-weight:600;color:var(--gray);white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{color:var(--orange);border-color:var(--orange)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--gray);margin:10px 0 4px}
input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:rgba(15,23,42,.05);color:var(--white);font-size:14px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-block;background:var(--orange);color:#fff;border:none;border-radius:30px;
  padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}
.btn:hover{background:var(--orange2)}
.btn-sm{padding:6px 14px;font-size:12px;margin-top:0}
.item{border-bottom:1px solid var(--border);padding:14px 0}
.item:last-child{border-bottom:none}
.item-title{font-weight:700;font-size:15px}
.item-meta{font-size:12px;color:var(--gray);margin:4px 0 8px}
.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;background:rgba(8,145,178,.2);color:#67E8F9}
.badge-free{background:rgba(5,150,105,.2);color:#34D399}
.empty{color:var(--gray);font-size:13px;text-align:center;padding:24px 0}
.msg{font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:12px}
.msg-ok{background:rgba(5,150,105,.15);color:#34D399}
.msg-err{background:rgba(239,68,68,.15);color:#F87171}
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-logo">LOKALI <b>FORMATIONS</b></span>
  <a class="nav-back" href="/lokali-hub.html">‹ Opportunités</a>
</nav>

<div class="wrap">
  <h1>Montez en compétence</h1>
  <div class="subtitle">Formations, ateliers et parcours pour progresser</div>
  <div class="stats-bar">
    <span class="stat-pill" id="statFormations">…</span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="liste">Formations disponibles</div>
    <div class="tab" data-tab="publier">Publier une formation</div>
  </div>

  <div id="authGate" class="card" style="display:none">
    <h3>Connexion requise</h3>
    <p style="font-size:13px;color:var(--gray)">Connecte-toi depuis LOKALI pour t'inscrire ou publier.</p>
    <a class="btn" href="/">Aller me connecter</a>
  </div>

  <div id="tab-liste" class="tab-content">
    <div id="liste" class="card"><div class="empty">Chargement...</div></div>
  </div>

  <div id="tab-publier" class="tab-content" style="display:none">
    <div id="publierMsg"></div>
    <div class="card">
      <h3>Publier une formation</h3>
      <label>Titre</label>
      <input id="fTitre" placeholder="Ex: Initiation au développement web">
      <label>Description</label>
      <textarea id="fDescription" placeholder="Programme, objectifs, prérequis..."></textarea>
      <div class="row2">
        <div><label>Catégorie / secteur</label><select id="fCategorie"></select></div>
        <div>
          <label>Niveau</label>
          <select id="fNiveau">
            <option value="debutant">Débutant</option>
            <option value="intermediaire">Intermédiaire</option>
            <option value="avance">Avancé</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div>
          <label>Format</label>
          <select id="fFormat">
            <option value="en_ligne">En ligne</option>
            <option value="presentiel">Présentiel</option>
            <option value="hybride">Hybride</option>
          </select>
        </div>
        <div><label>Durée</label><input id="fDuree" placeholder="Ex: 6 semaines"></div>
      </div>
      <div class="row2">
        <div><label>Prix (FCFA, 0 = gratuit)</label><input id="fPrix" type="number" value="0"></div>
      </div>
      <div class="row2">
        <div><label>Pays (si présentiel)</label><select id="fPays"></select></div>
        <div><label>Ville (si présentiel)</label><select id="fVille"></select></div>
      </div>
      <div id="fVilleAutreWrap" style="display:none">
        <label>Précise la ville</label>
        <input id="fVilleAutre" placeholder="Nom de la ville">
      </div>
      <label>Lien vers la ressource (optionnel)</label>
      <input id="fLien" placeholder="https://...">
      <button class="btn" onclick="publier()">Publier la formation</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/lokali-referentiel.js"></script>
<script>
var SUPA_URL = "https://qmwdneqxyyvrcrseudwt.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2RuZXF4eXl2cmNyc2V1ZHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDIwMDEsImV4cCI6MjA5ODIxODAwMX0.pQIxHsk080-SY-eeG268zS-uhJHuFQv6QE6pcH5vBB8";
var _supabase = supabase.createClient(SUPA_URL, SUPA_KEY);
var _userId = null;

var LABELS_NIVEAU = { debutant: "Débutant", intermediaire: "Intermédiaire", avance: "Avancé" };
var LABELS_FORMAT = { en_ligne: "En ligne", presentiel: "Présentiel", hybride: "Hybride" };

function activerOnglet(nom) {
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("active", t.dataset.tab === nom); });
  document.querySelectorAll(".tab-content").forEach(function(c){ c.style.display = (c.id === "tab-" + nom) ? "" : "none"; });
}
document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", function(){ activerOnglet(t.dataset.tab); });
});

function afficherMsg(elId, texte, ok) {
  var el = document.getElementById(elId);
  el.innerHTML = '<div class="msg ' + (ok ? "msg-ok" : "msg-err") + '">' + texte + '</div>';
  setTimeout(function(){ el.innerHTML = ""; }, 4000);
}

async function initSession() {
  var res = await _supabase.auth.getSession();
  var session = res && res.data ? res.data.session : null;
  if (session) { _userId = session.user.id; initDropdownsFormation(); }
  else {
    document.getElementById("authGate").style.display = "";
    document.querySelectorAll(".tab-content").forEach(function(c){ c.style.display = "none"; });
    document.querySelectorAll(".tab").forEach(function(t){ t.style.display = "none"; });
    return;
  }
  chargerStats();
  chargerListe();
}

function initDropdownsFormation() {
  fillSecteursSelect(document.getElementById("fCategorie"));
  fillPaysSelect(document.getElementById("fPays"));
  document.getElementById("fPays").addEventListener("change", function() {
    fillVillesByPays(this.value, document.getElementById("fVille"));
  });
  document.getElementById("fVille").addEventListener("change", function() {
    document.getElementById("fVilleAutreWrap").style.display = (this.value === "__autre__") ? "" : "none";
  });
}

async function chargerStats() {
  try {
    var r = await _supabase.from("lokt_formations").select("*", { count: "exact", head: true }).eq("statut", "ouverte");
    document.getElementById("statFormations").textContent = (r.count || 0) + " formations ouvertes";
  } catch(e) {}
}

async function publier() {
  if (!_userId) { afficherMsg("publierMsg", "Connecte-toi d'abord.", false); return; }
  var titre = document.getElementById("fTitre").value.trim();
  var description = document.getElementById("fDescription").value.trim();
  if (!titre || !description) { afficherMsg("publierMsg", "Titre et description sont obligatoires.", false); return; }
  var villeVal = document.getElementById("fVille").value;
  if (villeVal === "__autre__") villeVal = document.getElementById("fVilleAutre").value.trim();
  var payload = {
    auteur_id: _userId,
    titre: titre,
    description: description,
    categorie: document.getElementById("fCategorie").value,
    niveau: document.getElementById("fNiveau").value,
    format: document.getElementById("fFormat").value,
    duree: document.getElementById("fDuree").value.trim(),
    prix: parseInt(document.getElementById("fPrix").value) || 0,
    pays: document.getElementById("fPays").value,
    ville: villeVal,
    lien_ressource: document.getElementById("fLien").value.trim()
  };
  var r = await _supabase.from("lokt_formations").insert(payload);
  if (r.error) { afficherMsg("publierMsg", "Erreur : " + r.error.message, false); return; }
  afficherMsg("publierMsg", "Formation publiée ✅", true);
  ["fTitre","fDescription","fDuree","fLien"].forEach(function(id){ document.getElementById(id).value = ""; });
  document.getElementById("fPrix").value = 0;
  activerOnglet("liste");
  chargerListe();
  chargerStats();
}

async function chargerListe() {
  var el = document.getElementById("liste");
  var r = await _supabase.from("lokt_formations").select("*").eq("statut", "ouverte").order("created_at", { ascending: false }).limit(30);
  if (r.error || !r.data || !r.data.length) { el.innerHTML = '<div class="empty">Aucune formation disponible pour le moment.</div>'; return; }

  el.innerHTML = r.data.map(function(f){
    var prixHtml = f.prix > 0 ? '<span class="badge">' + f.prix + ' FCFA</span>' : '<span class="badge badge-free">Gratuit</span>';
    var lieu = f.format === "en_ligne" ? "En ligne" : (f.ville || "Lieu non précisé") + " · " + LABELS_FORMAT[f.format];
    return '<div class="item">' +
      '<span class="badge">' + (LABELS_NIVEAU[f.niveau] || f.niveau) + '</span> ' +
      (f.categorie ? '<span class="badge">' + f.categorie + '</span> ' : '') +
      prixHtml + ' ' +
      '<div class="item-title">' + f.titre + '</div>' +
      '<div class="item-meta">' + lieu + (f.duree ? ' · ' + f.duree : '') + '</div>' +
      '<div style="font-size:13px;color:var(--gray);margin-bottom:8px">' + f.description.slice(0, 160) + (f.description.length > 160 ? '…' : '') + '</div>' +
      (f.lien_ressource ? '<a href="' + f.lien_ressource + '" target="_blank" style="font-size:12px;color:var(--orange2)">Voir la ressource →</a><br>' : '') +
      '<button class="btn btn-sm" onclick="sinscrire(\'' + f.id + '\')">M\'inscrire</button>' +
      '</div>';
  }).join("");
}

async function sinscrire(formationId) {
  if (!_userId) { alert("Connecte-toi d'abord."); return; }
  var ins = await _supabase.from("lokt_formation_inscriptions").insert({
    formation_id: formationId, participant_id: _userId
  });
  if (ins.error) {
    if (ins.error.message.indexOf("duplicate") !== -1) { alert("Tu es déjà inscrit à cette formation ✅"); return; }
    alert("Erreur : " + ins.error.message); return;
  }
  alert("Inscription confirmée ✅");
}

initSession();
</script>
<script src="/lokali-widgets-unifie.js"></script>
</body>
</html>
