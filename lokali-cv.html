<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CV — LOKALI</title>
<meta name="description" content="Consulte un CV professionnel partagé sur LOKALI.">
<link rel="canonical" href="https://mylokali.com/lokali-cv.html">
<style>
:root{
  --orange:#F97316;--orange2:#FB923C;--orange-txt:#C2410C;
  --dark:#F1F5F9;--card:#FFFFFF;--border:rgba(15,23,42,.10);
  --white:#1E293B;--gray:#64748B;--radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--dark);color:var(--white);padding-bottom:60px}
.nav{position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(15,23,42,.06);padding:10px 16px;min-height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--white);font-size:18px;font-weight:900}
.wrap{max-width:900px;margin:0 auto;padding:80px 16px 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:14px;text-align:center}
.btn{display:inline-block;background:var(--orange);color:#fff;border:none;border-radius:30px;
  padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px;text-decoration:none}
.btn:hover{background:var(--orange2)}
.empty{color:var(--gray);font-size:13px;text-align:center;padding:24px 0}
#cvApercu{background:#fff;border-radius:var(--radius);box-shadow:0 4px 24px rgba(15,23,42,.08);
  max-width:760px;margin:0 auto;overflow:hidden;font-family:'Georgia',serif}
.cv-header{background:linear-gradient(135deg,#1E293B,#334155);color:#fff;padding:32px;display:flex;gap:20px;align-items:center}
.cv-photo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.3);flex-shrink:0}
.cv-photo-vide{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.15);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:32px}
.cv-nom{font-size:24px;font-weight:900}
.cv-titre{font-size:14px;opacity:.85;margin-top:2px}
.cv-contacts{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;opacity:.85}
.cv-body{padding:28px 32px;color:#1E293B;font-family:'Segoe UI',Arial,sans-serif}
.cv-section{margin-bottom:22px}
.cv-section-titre{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#F97316;
  border-bottom:2px solid #F97316;padding-bottom:4px;margin-bottom:10px}
.cv-exp-item{margin-bottom:14px}
.cv-exp-poste{font-size:14px;font-weight:800}
.cv-exp-meta{font-size:12px;color:#64748B;margin-bottom:4px}
.cv-exp-desc{font-size:13px;line-height:1.5}
.cv-chip{display:inline-block;background:#FFF7ED;color:#C2410C;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;margin:0 6px 6px 0}
.cv-portfolio-item{display:inline-block;width:31%;margin:0 1% 12px;vertical-align:top}
.cv-portfolio-item img{width:100%;border-radius:8px;height:80px;object-fit:cover}
.cv-portfolio-item div{font-size:11px;text-align:center;margin-top:4px;color:#64748B}
@media print {
  .nav, .btn, .no-print { display:none !important; }
  body { background:#fff; padding:0 }
  #cvApercu { box-shadow:none; max-width:100% }
  .wrap{padding:0}
}
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-logo"><img src="/lokali-logo-v2.svg" alt="LOKALI" style="height:26px"></span>
  <a class="nav-logo" href="/" style="font-size:13px">Accueil ›</a>
</nav>

<div class="wrap">
  <div id="zoneConnexionRequise" class="card" style="display:none">
    <div style="font-size:32px;margin-bottom:10px">🔒</div>
    <h2 style="margin-bottom:8px">Connexion requise</h2>
    <p style="font-size:13px;color:var(--gray);margin-bottom:4px">Ce CV est réservé aux membres de LOKALI.</p>
    <p style="font-size:13px;color:var(--gray)">Connecte-toi ou crée un compte gratuitement (par email ou numéro de téléphone) pour le consulter.</p>
    <a class="btn" href="/?action=inscription">Se connecter / Créer un compte</a>
  </div>

  <div id="zoneCv" style="display:none">
    <div class="no-print" style="text-align:center;margin-bottom:16px">
      <button class="btn" onclick="window.print()">🖨️ Télécharger en PDF</button>
    </div>
    <div id="cvApercu"><div class="empty">Chargement...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/lokali-confiance-widget.js"></script>
<script>
var SUPA_URL = "https://qmwdneqxyyvrcrseudwt.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2RuZXF4eXl2cmNyc2V1ZHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDIwMDEsImV4cCI6MjA5ODIxODAwMX0.pQIxHsk080-SY-eeG268zS-uhJHuFQv6QE6pcH5vBB8";
var _supabase = supabase.createClient(SUPA_URL, SUPA_KEY);
var _couleurCv = "#F97316";
var _cvData = {};
var _cvUpdatedAt = null;
var _idConsulte = null;

function normaliserCv(data) {
  return {
    nom_complet: data.nom_complet, titre_professionnel: data.titre_professionnel, presentation: data.presentation,
    photo_url: data.photo_url, telephone: data.telephone, whatsapp: data.whatsapp, email_public: data.email_public,
    pays: data.pays, ville: data.ville,
    experiences: data.experiences || [], formations: data.formations || [], competences: data.competences || [],
    langues: data.langues || [], certifications: data.certifications || [], portfolio: data.portfolio || []
  };
}

function rendreApercu() {
  var d = _cvData;
  var photo = d.photo_url ? '<img class="cv-photo" src="' + d.photo_url + '">' : '<div class="cv-photo-vide">👤</div>';
  var contacts = [];
  if (d.telephone) contacts.push("📞 " + d.telephone);
  if (d.whatsapp) contacts.push("💬 " + d.whatsapp);
  if (d.email_public) contacts.push("✉️ " + d.email_public);
  if (d.ville) contacts.push("📍 " + d.ville + (d.pays ? ", " + d.pays : ""));

  var html = '<style>#cvApercu .cv-section-titre{color:' + _couleurCv + ' !important;border-color:' + _couleurCv + ' !important}' +
    '#cvApercu .cv-chip{background:' + _couleurCv + '1A !important;color:' + _couleurCv + ' !important}</style>';

  html += '<div class="cv-header">' + photo +
    '<div><div class="cv-nom">' + (d.nom_complet || "Nom non renseigné") + '</div>' +
    '<div class="cv-titre">' + (d.titre_professionnel || "") + '</div>' +
    '<div class="cv-contacts">' + contacts.map(function(c){ return '<span>' + c + '</span>'; }).join("") + '</div></div></div>';

  html += '<div class="cv-body">';

  if (d.presentation) {
    html += '<div class="cv-section"><div class="cv-section-titre">Présentation</div><div class="cv-exp-desc">' + d.presentation + '</div></div>';
  }
  if (d.experiences && d.experiences.length) {
    html += '<div class="cv-section"><div class="cv-section-titre">Expériences professionnelles</div>' +
      d.experiences.map(function(e){
        var periode = (e.debut || "?") + " → " + (e.en_cours ? "Aujourd'hui" : (e.fin || "?"));
        return '<div class="cv-exp-item"><div class="cv-exp-poste">' + e.poste + (e.structure ? " — " + e.structure : "") + '</div>' +
          '<div class="cv-exp-meta">' + periode + '</div>' +
          (e.description ? '<div class="cv-exp-desc">' + e.description + '</div>' : '') + '</div>';
      }).join("") + '</div>';
  }
  if (d.formations && d.formations.length) {
    html += '<div class="cv-section"><div class="cv-section-titre">Formations</div>' +
      d.formations.map(function(f){
        return '<div class="cv-exp-item"><div class="cv-exp-poste">' + f.diplome + '</div>' +
          '<div class="cv-exp-meta">' + (f.etablissement || "") + (f.domaine ? " · " + f.domaine : "") + (f.annee ? " · " + f.annee : "") + '</div></div>';
      }).join("") + '</div>';
  }
  if (d.competences && d.competences.length) {
    html += '<div class="cv-section"><div class="cv-section-titre">Compétences</div>' +
      d.competences.map(function(c){ return '<span class="cv-chip">' + c + '</span>'; }).join("") + '</div>';
  }
  if (d.langues && d.langues.length) {
    html += '<div class="cv-section"><div class="cv-section-titre">Langues</div>' +
      d.langues.map(function(l){ return '<span class="cv-chip">' + l.langue + " — " + l.niveau + '</span>'; }).join("") + '</div>';
  }
  if (d.certifications && d.certifications.length) {
    html += '<div class="cv-section"><div class="cv-section-titre">Certifications</div>' +
      d.certifications.map(function(c){
        return '<div class="cv-exp-item"><div class="cv-exp-poste">' + c.nom + '</div><div class="cv-exp-meta">' + (c.organisme || "") + (c.annee ? " · " + c.annee : "") + '</div></div>';
      }).join("") + '</div>';
  }
  if (d.portfolio && d.portfolio.length) {
    html += '<div class="cv-section"><div class="cv-section-titre">Portfolio</div>' +
      d.portfolio.map(function(p){
        return '<div class="cv-portfolio-item">' + (p.image_url ? '<img src="' + p.image_url + '">' : '') + '<div>' + p.titre + '</div></div>';
      }).join("") + '</div>';
  }

  html += '</div>';

  var lienVerif = window.location.origin + "/lokali-cv.html?voir=" + _idConsulte;
  var dateMaj = _cvUpdatedAt ? new Date(_cvUpdatedAt).toLocaleDateString("fr-FR") : new Date().toLocaleDateString("fr-FR");
  html += '<div style="border-top:1px solid #E2E8F0;padding:14px 32px;font-size:11px;color:#94A3B8;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
    '<span>Document généré via LOKALI · Vérifiable sur ' + lienVerif + ' · Mis à jour le ' + dateMaj + '</span>' +
    '<span id="cvScoreConfiance"></span>' +
    '</div>';

  document.getElementById("cvApercu").innerHTML = html;
  if (_idConsulte && window.afficherScoreConfiance) afficherScoreConfiance(_supabase, _idConsulte, "cvScoreConfiance");
}

async function initSession() {
  var params = new URLSearchParams(window.location.search);
  _idConsulte = params.get("voir");
  if (!_idConsulte) { window.location.href = "/lokali-emplois.html#cv"; return; }

  var res = await _supabase.auth.getSession();
  var session = res && res.data ? res.data.session : null;

  // Connexion obligatoire pour consulter, comme dans le fichier d'origine.
  if (!session) {
    document.getElementById("zoneConnexionRequise").style.display = "";
    return;
  }

  var r = await _supabase.from("lokt_cv").select("*").eq("user_id", _idConsulte).maybeSingle();
  document.getElementById("zoneCv").style.display = "";
  if (!r.data) {
    document.getElementById("cvApercu").innerHTML = '<div class="empty" style="padding:40px 0">Ce CV est introuvable ou n\'est plus disponible.</div>';
    return;
  }
  _cvData = normaliserCv(r.data);
  _cvUpdatedAt = r.data.updated_at;
  rendreApercu();
}

initSession();
</script>
</body>
</html>
