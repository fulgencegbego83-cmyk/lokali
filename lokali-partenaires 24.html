<style>
:root{
  --orange:#059669;--orange2:#34D399;--orange-txt:#047857;--green:#059669;
  --dark:#F1F5F9;--dark2:#FFFFFF;--dark3:#E2E8F0;
  --card:#FFFFFF;--border:rgba(15,23,42,.10);
  --white:#1E293B;--gray:#64748B;--radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--dark);color:var(--white);padding-bottom:60px}
.nav{position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);box-shadow:0 2px 12px rgba(15,23,42,.06);
  border-bottom:1px solid rgba(15,23,42,.06);padding:10px 16px;min-height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--white);font-size:18px;font-weight:900}
.nav-logo b{color:var(--orange-txt)}
.nav-back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--white);text-decoration:none;
  background:rgba(15,23,42,.08);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-weight:600}
.nav-back:hover{background:rgba(15,23,42,.14)}
.wrap{max-width:640px;margin:0 auto;padding:80px 16px 20px}
h1{font-size:22px;margin-bottom:4px}
.subtitle{color:var(--gray);font-size:14px;margin-bottom:12px}
.stats-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat-pill{font-size:11px;font-weight:800;color:#34D399;background:rgba(5,150,105,.15);border-radius:20px;padding:4px 12px}
.tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--border);overflow-x:auto}
.filtre-chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.filtre-chip{background:var(--card);border:1px solid var(--border);color:var(--white);font-size:12.5px;
  font-weight:600;border-radius:20px;padding:12px 16px;cursor:pointer;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
.filtre-chip.active{background:var(--orange);border-color:var(--orange);color:#fff}
.tab{padding:12px 10px;font-size:14px;font-weight:600;color:var(--gray);white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;min-height:44px;display:inline-flex;align-items:center}
.tab.active{color:var(--orange-txt);border-color:var(--orange)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.fiche-header{background:var(--white);color:#fff;padding:14px 18px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;border-radius:14px 14px 0 0}
.fiche-body{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;padding:6px 18px;margin-bottom:20px}
.fiche-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.fiche-row:last-child{border-bottom:none}
.fiche-icon-box{background:rgba(15,23,42,.05);color:var(--gray);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.fiche-icon-box.highlight{background:rgba(249,115,22,.12);color:var(--orange-txt)}
.fiche-label{font-size:11px;color:var(--gray);text-transform:uppercase;font-weight:700;letter-spacing:.5px}
.fiche-value{font-size:14.5px;font-weight:600;color:var(--white);margin-top:2px}
.fiche-value.highlight{color:var(--orange-txt);font-weight:800}
.card h3{font-size:15px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--gray);margin:10px 0 4px}
input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:rgba(15,23,42,.05);color:var(--white);font-size:14px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-block;background:var(--orange);color:#fff;border:none;border-radius:30px;
  padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}
.btn:hover{background:var(--orange2)}
.btn-sm{padding:6px 14px;font-size:12px;margin-top:0}
.item{border-bottom:1px solid var(--border);padding:14px 0}
.item:last-child{border-bottom:none}
.item-title{font-weight:700;font-size:15px}
.item-meta{font-size:12px;color:var(--gray);margin:4px 0 8px}
.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;background:rgba(124,58,237,.2);color:#C4B5FD}
.empty{color:var(--gray);font-size:13px;text-align:center;padding:24px 0}
.msg{font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:12px}
.msg-ok{background:rgba(5,150,105,.15);color:#34D399}
.msg-err{background:rgba(239,68,68,.15);color:#F87171}
</style>

<div class="wrap">
  <h1>Trouvez le bon partenaire</h1>
  <div class="subtitle">Associé, partenaire technique, financier, distributeur...</div>
  <div class="stats-bar">
    <span class="stat-pill" id="statPartenariats">…</span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="liste">Recherches en cours</div>
    <div class="tab" data-tab="publier">Publier une recherche</div>

  <div id="authGate" class="card" style="display:none">

    <p style="font-size:13px;color:var(--gray)">Connecte-toi depuis LOKALI pour publier ou répondre.</p>

  <div id="tab-liste" class="tab-content">

  </div>

  <div id="tab-publier" class="tab-content" style="display:none">
    <div id="publierMsg"></div>
    <div class="card">
      <h3>Publier une recherche de partenaire</h3>
      <label>Titre</label>
      <input id="pTitre" placeholder="Ex: Je cherche un partenaire technique pour créer une application">
      <label>Description</label>

      <div class="row2">
        <div>
          <label>Type de partenaire</label>
          <select id="pType">
            <option value="technique">Technique</option>

          </select>
        </div>

      </div>
      <div class="row2">
        <div><label>Pays</label><select id="pPays"></select></div>
        <div><label>Ville</label><select id="pVille"></select></div>
      </div>
      <div id="pVilleAutreWrap" style="display:none">
        <label>Précise la ville</label>
        <input id="pVilleAutre" placeholder="Nom de la ville">

      <label style="display:flex;align-items:center;gap:8px;margin-top:12px">
        <input type="checkbox" id="pRemote" style="width:auto"> Ouvert à distance
      </label>
      <label>Pitch deck / business plan (PDF, optionnel)</label>
      <input type="file" id="pDocumentFichier" accept="application/pdf,image/*">

      <label>Téléphone</label>
      <input id="pContactTelephone" placeholder="Ex: +225 07 00 00 00 00">
      <label>Email</label>
      <input id="pContactEmail" type="email" placeholder="Ex: contact@exemple.com">
      <button class="btn" onclick="publier()">Publier</button>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
var SUPA_URL = "https://qmwdneqxyyvrcrseudwt.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2RuZXF4eXl2cmNyc2V1ZHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDIwMDEsImV4cCI6MjA5ODIxODAwMX0.pQIxHsk080-SY-eeG268zS-uhJHuFQv6QE6pcH5vBB8";
var _supabase = supabase.createClient(SUPA_URL, SUPA_KEY);
var _userId = null;
var _pPhotos = null;
var _editionId = null;
var _editionDocumentUrlActuel = null;
var _partenariatsCache = {};

var LABELS_TYPE = { technique: "Technique", commercial: "Commercial", financier: "Financier", strategique: "Stratégique", distributeur: "Distributeur", associe: "Associé" };

function activerOnglet(nom) {
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("active", t.dataset.tab === nom); });
  document.querySelectorAll(".tab-content").forEach(function(c){ c.style.display = (c.id === "tab-" + nom) ? "" : "none"; });
}
document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", function(){ activerOnglet(t.dataset.tab); });
});

function afficherMsg(elId, texte, ok) {
  var el = document.getElementById(elId);
  el.innerHTML = '<div class="msg ' + (ok ? "msg-ok" : "msg-err") + '">' + texte + '</div>';
  setTimeout(function(){ el.innerHTML = ""; }, 4000);
}

async function initSession() {
  var res = await _supabase.auth.getSession();
  var session = res && res.data ? res.data.session : null;
  if (session) {
    _userId = session.user.id;
    initDropdownsPartenaires();
    if (window.LokaliPhotos) {
      _pPhotos = LokaliPhotos.creerUploader("pPhotos", 5);
      document.getElementById("pPhotosZone").appendChild(_pPhotos.element);
    }
  } else {
    document.getElementById("authGate").style.display = "";
    document.querySelectorAll(".tab-content").forEach(function(c){ c.style.display = "none"; });
    document.querySelectorAll(".tab").forEach(function(t){ t.style.display = "none"; });
    return;
  }
  chargerStats();
  chargerListe();
}

function initDropdownsPartenaires() {
  fillSecteursSelect(document.getElementById("pSecteur"));
  fillPaysSelect(document.getElementById("pPays"));
  document.getElementById("pPays").addEventListener("change", function() {
    fillVillesByPays(this.value, document.getElementById("pVille"));
  });
  document.getElementById("pVille").addEventListener("change", function() {
    document.getElementById("pVilleAutreWrap").style.display = (this.value === "__autre__") ? "" : "none";
  });
}

async function chargerStats() {
  try {
    var r = await _supabase.from("lokt_partenariats").select("*", { count: "exact", head: true }).eq("statut", "ouvert");
    document.getElementById("statPartenariats").textContent = (r.count || 0) + " recherches ouvertes";
  } catch(e) {}
}

async function publier() {
  if (!_userId) { afficherMsg("publierMsg", "Connecte-toi d'abord.", false); return; }
  var titre = document.getElementById("pTitre").value.trim();
  var description = document.getElementById("pDescription").value.trim();
  if (!titre || !description) { afficherMsg("publierMsg", "Titre et description sont obligatoires.", false); return; }
  if (window.LokaliModeration) {
    var moderation = LokaliModeration.verifierTexte(titre + " " + description);
    if (!moderation.ok) { afficherMsg("publierMsg", moderation.motif, false); return; }
  }
  var villeVal = document.getElementById("pVille").value;
  if (villeVal === "__autre__") villeVal = document.getElementById("pVilleAutre").value.trim();

  var documentUrl = _editionId ? _editionDocumentUrlActuel : null;
  var fichier = document.getElementById("pDocumentFichier").files[0];
  if (fichier) {
    var chemin = _userId + "/partenariat-doc-" + Date.now() + "-" + fichier.name;
    var up = await _supabase.storage.from("lokali-cv-fichiers").upload(chemin, fichier);
    if (up.error) { afficherMsg("publierMsg", "Erreur upload du document : " + up.error.message, false); return; }
    documentUrl = _supabase.storage.from("lokali-cv-fichiers").getPublicUrl(chemin).data.publicUrl;
  }

  var payload = {
    auteur_id: _userId,
    titre: titre,
    description: description,
    type_partenaire: document.getElementById("pType").value,
    secteur: document.getElementById("pSecteur").value,
    pays: document.getElementById("pPays").value,
    ville: villeVal,
    remote_ok: document.getElementById("pRemote").checked,
    document_url: documentUrl,
    contact_whatsapp: document.getElementById("pContactWhatsapp").value.trim() || null,
    contact_telephone: document.getElementById("pContactTelephone").value.trim() || null,
    contact_email: document.getElementById("pContactEmail").value.trim() || null,
    photos: _pPhotos ? _pPhotos.getPhotos() : []
  };
  var r;
  if (_editionId) {
    r = await _supabase.from("lokt_partenariats").update(payload).eq("id", _editionId);
  } else {
    payload.statut = "ouvert";
    r = await _supabase.from("lokt_partenariats").insert(payload);
  }
  if (r.error) { afficherMsg("publierMsg", "Erreur : " + r.error.message, false); return; }
  document.getElementById("publierMsg").innerHTML = '<div class="msg msg-ok" style="font-size:15px;padding:16px;text-align:center">✅ <b>Partenariat publié avec succès !</b></div>';
  annulerEdition();
  setTimeout(function(){
    activerOnglet("liste");
    chargerListe();
    chargerStats();
  }, 1200);
}

function modifierPartenariat(p) {
  activerOnglet("publier");
  _editionId = p.id;
  _editionDocumentUrlActuel = p.document_url || null;
  document.getElementById("pTitre").value = p.titre || "";
  document.getElementById("pDescription").value = p.description || "";
  document.getElementById("pType").value = p.type_partenaire || "technique";
  document.getElementById("pSecteur").value = p.secteur || "";
  document.getElementById("pPays").value = p.pays || "";
  fillVillesByPays(p.pays, document.getElementById("pVille"));
  setTimeout(function(){ document.getElementById("pVille").value = p.ville || ""; }, 300);
  document.getElementById("pRemote").checked = !!p.remote_ok;
  document.getElementById("pContactWhatsapp").value = p.contact_whatsapp || "";
  document.getElementById("pContactTelephone").value = p.contact_telephone || "";
  document.getElementById("pContactEmail").value = p.contact_email || "";
  var titreBloc = document.querySelector("#tab-publier h3");
  if (titreBloc) titreBloc.textContent = "Modifier ma recherche de partenaire";
  var btn = document.querySelector("#tab-publier .btn");
  if (btn) btn.textContent = "Enregistrer les modifications";
}

function annulerEdition() {
  _editionId = null;
  _editionDocumentUrlActuel = null;
  ["pTitre","pDescription"].forEach(function(id){ document.getElementById(id).value = ""; });
  document.getElementById("pRemote").checked = false;
  document.getElementById("pContactWhatsapp").value = "";
  document.getElementById("pContactTelephone").value = "";
  document.getElementById("pContactEmail").value = "";
  document.getElementById("pDocumentFichier").value = "";
  var titreBloc = document.querySelector("#tab-publier h3");
  if (titreBloc) titreBloc.textContent = "Publier une recherche de partenaire";
  var btn = document.querySelector("#tab-publier .btn");
  if (btn) btn.textContent = "Publier";
}

function formaterNumeroWa(numero) {
  return (numero || "").replace(/[^0-9]/g, "");
}

function partagerPartenariat(id, titre) {
  var url = window.location.origin + "/lokali-partenaires.html?id=" + id;
  var texte = "🔥 " + titre + " — à voir sur LOKALI";
  if (navigator.share) {
    navigator.share({ title: titre, text: texte, url: url }).catch(function(){});
  } else {
    window.open("https://wa.me/?text=" + encodeURIComponent(texte + " : " + url), "_blank");
  }
}

function boutonsContactDirect(item) {
  if (!_userId) {
    return '<a href="/?action=inscription" class="btn btn-sm" style="background:rgba(15,23,42,.08);color:var(--white)">🔒 Connecte-toi sur LOKALI pour voir les coordonnées</a> ';
  }
  var boutons = "";
  if (item.contact_whatsapp) boutons += '<a href="https://wa.me/' + formaterNumeroWa(item.contact_whatsapp) + '" target="_blank" class="btn btn-sm" style="background:#25D366;color:#fff">💬 WhatsApp</a> ';
  if (item.contact_telephone) boutons += '<a href="tel:' + item.contact_telephone + '" class="btn btn-sm" style="background:rgba(15,23,42,.08);color:var(--white)">📞 Appeler</a> ';
  if (item.contact_email) boutons += '<a href="mailto:' + item.contact_email + '" class="btn btn-sm" style="background:rgba(15,23,42,.08);color:var(--white)">✉️ Email</a> ';
  return boutons;
}

  var p = _partenariatsCache[id];
  if (!p) return;
  var photos = (p.photos && p.photos.length) ? p.photos : [];
  var lieu = p.remote_ok ? (p.ville ? p.ville + " · À distance OK" : "À distance OK") : (p.ville || "Non précisé");

  var galerieHtml = photos.length

      '<button onclick="fermerDetailPartenariat()" style="background:rgba(15,23,42,.08);border:none;border-radius:20px;padding:8px 16px;font-weight:700;cursor:pointer;color:var(--white)">‹ Retour</button>' +
      '<span style="font-weight:800;font-size:14px">Détail du partenariat</span>' +
      '<button onclick="partagerPartenariat(\'' + p.id + '\',\'' + p.titre.replace(/'/g,"\\'") + '\')" style="background:#25D366;border:none;border-radius:20px;padding:8px 14px;font-weight:700;cursor:pointer;color:#fff;font-size:13px">📤</button>' +
    '</div>' +
    '<div style="max-width:640px;margin:0 auto;padding:20px 16px 40px">' +
      '<span class="badge" style="margin-bottom:10px;display:inline-block">' + (LABELS_TYPE[p.type_partenaire] || p.type_partenaire) + '</span> ' +
      (p.secteur ? '<span class="badge" style="margin-bottom:10px">' + p.secteur + '</span>' : '') +
      '<h1 style="font-size:20px;font-weight:900;margin:10px 0 8px;color:var(--white)">' + p.titre + '</h1>' +
      galerieHtml +
      '<div class="fiche-header">📋 Fiche synthétique du partenariat</div>' +
      '<div class="fiche-body">' +
        '<div class="fiche-row"><div class="fiche-icon-box highlight">🤝</div><div><div class="fiche-label">Type de partenariat</div><div class="fiche-value highlight">' + (LABELS_TYPE[p.type_partenaire] || p.type_partenaire) + '</div></div></div>' +
        (p.secteur ? '<div class="fiche-row"><div class="fiche-icon-box">🏷️</div><div><div class="fiche-label">Secteur</div><div class="fiche-value">' + p.secteur + '</div></div></div>' : '') +
        '<div class="fiche-row"><div class="fiche-icon-box">📍</div><div><div class="fiche-label">Zone locale</div><div class="fiche-value">' + lieu + '</div></div></div>' +
        '<div class="fiche-row"><div class="fiche-icon-box">📅</div><div><div class="fiche-label">Publié le</div><div class="fiche-value">' + dateTxt + '</div></div></div>' +
      '</div>' +
      (p.document_url ? '<a href="' + p.document_url + '" target="_blank" style="display:block;margin-bottom:20px;font-size:13px;color:var(--orange2);font-weight:700">📎 Voir le pitch deck / business plan →</a>' : '') +
      '<h3 style="font-size:15px;margin-bottom:10px">Description</h3>' +
      '<p style="font-size:14px;color:var(--white);line-height:1.7;white-space:pre-wrap;margin-bottom:24px">' + p.description + '</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px">' +
        boutonsContactDirect(p) +
        '<button class="btn" style="background:var(--orange)" onclick="manifesterInteret(\'' + p.id + '\')">Je suis intéressé</button>' +
        '<button class="btn btn-sm" style="background:rgba(220,38,38,.08);color:#DC2626" onclick="LokaliSignaler.ouvrirModal(_supabase,\'utilisateur\',\'' + p.auteur_id + '\',_userId)">🚩 Signaler</button>' +
      '</div>' +
      '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">👤 L\'auteur</h3><div id="avisResumePartenaire">Chargement...</div><div id="avisFormPartenaire" style="margin-top:10px"></div></div>' +
    '</div>';
  document.body.appendChild(overlay);
  document.body.style.overflow = "hidden";
  chargerAvisPartenaire(p.auteur_id);
}

async function chargerAvisPartenaire(auteurId) {
  if (!window.LokaliAvis) return;
  var resume = await LokaliAvis.chargerResume(_supabase, "utilisateur", auteurId);
  document.getElementById("avisResumePartenaire").innerHTML = LokaliAvis.afficherResumeHTML(resume);
  var formZone = document.getElementById("avisFormPartenaire");
  if (!_userId) { formZone.innerHTML = '<a href="/?action=inscription" class="btn btn-sm" style="background:rgba(15,23,42,.08);color:var(--white)">🔒 Connecte-toi pour laisser un avis</a>'; return; }
  if (_userId === auteurId) { formZone.style.display = "none"; return; }
  formZone.innerHTML = LokaliAvis.construireFormulaireHTML("avisP");
  LokaliAvis.activerFormulaire("avisP", _supabase, "utilisateur", auteurId, _userId, function(){ chargerAvisPartenaire(auteurId); });
}

function fermerDetailPartenariat() {
  var overlay = document.getElementById("partenariatDetailOverlay");
  if (overlay) overlay.remove();
  document.body.style.overflow = "";
}

async function chargerListe() {
  var el = document.getElementById("liste");
  var r = await _supabase.from("lokt_partenariats").select("*").eq("statut", "ouvert").order("created_at", { ascending: false }).limit(30);
  if (r.error || !r.data || !r.data.length) { el.innerHTML = '<div class="empty">Aucune recherche en cours pour le moment.</div>'; return; }
  _partenariatsCache = {};
  r.data.forEach(function(p){ _partenariatsCache[p.id] = p; });

  el.innerHTML = r.data.map(function(p){
    var lieu = p.remote_ok ? (p.ville ? p.ville + " · À distance OK" : "À distance OK") : (p.ville || "Lieu non précisé");
    var estAuteur = _userId && p.auteur_id === _userId;
    return '<div class="item" data-secteur="' + (p.secteur || "") + '">' +
      '<span class="badge">' + (LABELS_TYPE[p.type_partenaire] || p.type_partenaire) + '</span> ' +
      (p.secteur ? '<span class="badge">' + p.secteur + '</span> ' : '') +
      '<div class="item-title" style="cursor:pointer" onclick="ouvrirDetailPartenariat(\'' + p.id + '\')">' + p.titre + '</div>' +
      '<div class="item-meta">' + lieu + '</div>' +
      '<div style="font-size:13px;color:var(--gray);margin-bottom:8px">' + p.description.slice(0, 160) + (p.description.length > 160 ? '…' : '') + '</div>' +
      (p.photos && p.photos.length ? '<img src="' + p.photos[0] + '" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:10px;display:block;cursor:pointer" onclick="ouvrirDetailPartenariat(\'' + p.id + '\')">' : '') +
      (p.document_url ? '<a href="' + p.document_url + '" target="_blank" style="font-size:12px;color:var(--orange2)">📎 Pitch deck / business plan →</a><br>' : '') +
      '<div style="margin-top:4px"><button class="btn btn-sm" style="background:rgba(15,23,42,.08);color:var(--white)" onclick="ouvrirDetailPartenariat(\'' + p.id + '\')">📄 Voir la fiche complète</button></div>' +
      (estAuteur
        ? '<button class="btn btn-sm" style="background:rgba(15,23,42,.08);color:var(--white)" onclick="modifierPartenariat(_partenariatsCache[\'' + p.id + '\'])">✏️ Modifier</button> ' +
          '<button class="btn btn-sm" style="background:rgba(249,115,22,.1);color:var(--orange-txt)" onclick="voirReponses(\'' + p.id + '\',\'lokt_partenariat_candidatures\',\'partenariat_id\',\'candidat_id\',\'' + p.titre.replace(/'/g,"\\'") + '\')">👥 Voir les intéressés</button>'
        : boutonsContactDirect(p) + '<button class="btn btn-sm" onclick="manifesterInteret(\'' + p.id + '\')">Je suis intéressé</button> ' +
          '<button class="btn btn-sm" style="background:#25D366;color:#fff" onclick="partagerPartenariat(\'' + p.id + '\',\'' + p.titre.replace(/'/g,"\\'") + '\')">📤</button>') +
      '</div>';
  }).join("");
  construireChipsPartenariats(r.data);
}

var _filtreSecteurPartenariats = "";
function construireChipsPartenariats(liste) {
  var chipsWrap = document.getElementById("partenariatsChips");
  if (!chipsWrap) return;
  var secteurs = Array.from(new Set(liste.map(function(p){ return p.secteur; }).filter(Boolean)));
  if (!secteurs.length) { chipsWrap.innerHTML = ""; return; }
  chipsWrap.innerHTML = '<span class="filtre-chip active" data-val="">Tous</span>' +
    secteurs.map(function(s){ return '<span class="filtre-chip" data-val="' + s.replace(/"/g,'&quot;') + '">' + s + '</span>'; }).join("");
  chipsWrap.querySelectorAll(".filtre-chip").forEach(function(chip){
    chip.addEventListener("click", function(){
      chipsWrap.querySelectorAll(".filtre-chip").forEach(function(c){ c.classList.remove("active"); });
      chip.classList.add("active");
      _filtreSecteurPartenariats = chip.dataset.val;
      document.querySelectorAll("#liste .item").forEach(function(it){
        it.style.display = (!_filtreSecteurPartenariats || it.dataset.secteur === _filtreSecteurPartenariats) ? "" : "none";
      });
    });
  });
}

async function manifesterInteret(partenariatId) {
  if (!_userId) { alert("Connecte-toi d'abord."); return; }
  var message = prompt("Un message pour te présenter (optionnel) :") || "";
  var ins = await _supabase.from("lokt_partenariat_candidatures").insert({
    partenariat_id: partenariatId, candidat_id: _userId, message: message
  });
  if (ins.error) {
    if (ins.error.message.indexOf("duplicate") !== -1) { alert("Tu as déjà manifesté ton intérêt ✅"); return; }
    alert("Erreur : " + ins.error.message); return;
  }
  alert("Intérêt envoyé ✅");
}

initSession();
</script>
<script src="/lokali-widgets-unifie.js"></script>
<script src="/lokali-bandeau-sponsors.js"></script>
