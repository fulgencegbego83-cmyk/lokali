<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LOKALI</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --orange:#F97316;--orange2:#FB923C;--green:#059669;--red:#DC2626;
  --dark:#F1F5F9;--card:#FFFFFF;--border:rgba(15,23,42,.10);
  --white:#1E293B;--gray:#64748B;--radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--dark);color:var(--white);padding-bottom:60px}

.notfound{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gray);text-align:center;padding:20px}
.notfound h1{font-size:56px;color:var(--border);margin-bottom:8px}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;max-width:340px;width:100%;text-align:center}
.gate-box input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--border);font-size:15px;margin-bottom:12px}
.gate-box button{width:100%;background:var(--orange);color:#fff;border:none;padding:12px;border-radius:30px;font-weight:800;cursor:pointer}
.gate-err{color:var(--red);font-size:13px;margin-top:8px;display:none}

.nav{position:sticky;top:0;z-index:99;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);
  box-shadow:0 2px 12px rgba(15,23,42,.06);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}

.wrap{max-width:900px;margin:0 auto;padding:20px 16px}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.stat-card .n{font-size:20px;font-weight:900}
.stat-card .l{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

.tabs{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 16px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;
  background:var(--card);border:1px solid var(--border);color:var(--gray)}
.tab.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.tab .badge{background:rgba(255,255,255,.3);border-radius:10px;padding:1px 6px;margin-left:5px;font-size:11px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.card-top h3{font-size:16px}
.badge-statut{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap}
.st-nouveau{background:rgba(249,115,22,.15);color:var(--orange)}
.st-contacte{background:rgba(202,138,4,.15);color:#CA8A04}
.st-valide{background:rgba(5,150,105,.15);color:var(--green)}
.st-refuse{background:rgba(220,38,38,.12);color:var(--red)}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:13px;margin-bottom:10px}
.info-grid div b{color:var(--gray);font-weight:600;font-size:11px;text-transform:uppercase;display:block}
.msg-box{background:rgba(15,23,42,.04);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--gray);margin-bottom:12px}
.logo-preview{width:70px;height:70px;object-fit:contain;border-radius:8px;border:1px solid var(--border);background:#fff;margin-bottom:10px}

.action-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer}
.btn-contact{background:rgba(202,138,4,.15);color:#CA8A04}
.btn-valider{background:var(--green);color:#fff}
.btn-refuser{background:rgba(220,38,38,.12);color:var(--red)}
.btn-reset{background:rgba(15,23,42,.08);color:var(--white)}

.empty{text-align:center;color:var(--gray);padding:40px 0;font-size:13px}
.limite-alert{background:rgba(220,38,38,.1);color:var(--red);border-radius:10px;padding:8px 12px;font-size:12px;margin-top:8px}
</style>
</head>
<body>

<div class="notfound" id="page404">
  <h1 onclick="revelerAcces()" style="cursor:default;user-select:none">404</h1>
  <div>Page introuvable.</div>
</div>

<div class="gate" id="gate" style="display:none">
  <div class="gate-box">
    <input type="password" id="gatePwd" placeholder="Code d'accès">
    <button onclick="verifierMotDePasse()">Entrer</button>
    <div class="gate-err" id="gateErr">Code incorrect.</div>
  </div>
</div>

<div id="contenuAdmin" style="display:none">
  <nav class="nav">
    <span>LOKALI</span>
    <a href="/lokali-hub.html" style="font-size:13px;color:var(--gray);text-decoration:none">‹ Retour</a>
  </nav>

  <div class="wrap">
    <div class="card" id="cardCodes">
      <h3 style="font-size:15px;margin-bottom:10px">🎟️ Codes d'invitation sponsors</h3>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input type="text" id="cibleCode" placeholder="Destinataire (ex: Banque Atlantique)" style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border)">
        <button class="btn btn-valider" onclick="genererCode()">+ Générer</button>
      </div>
      <div id="listeCodes"><div class="empty">Chargement...</div></div>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div class="tabs" id="tabs">
      <div class="tab active" data-statut="tous" onclick="filtrer('tous')">Tous</div>
      <div class="tab" data-statut="nouveau" onclick="filtrer('nouveau')">Nouveau</div>
      <div class="tab" data-statut="contacte" onclick="filtrer('contacte')">Contacté</div>
      <div class="tab" data-statut="valide" onclick="filtrer('valide')">Validé</div>
      <div class="tab" data-statut="refuse" onclick="filtrer('refuse')">Refusé</div>
    </div>

    <div id="listeCandidatures"><div class="empty">Chargement...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SUPA_URL = "https://qmwdneqxyyvrcrseudwt.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2RuZXF4eXl2cmNyc2V1ZHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDIwMDEsImV4cCI6MjA5ODIxODAwMX0.pQIxHsk080-SY-eeG268zS-uhJHuFQv6QE6pcH5vBB8";
var _supabase = supabase.createClient(SUPA_URL, SUPA_KEY);

var ADMIN_PWD = "26Decembre83@@";
var LIMITES = { "Bronze": 12, "Argent": 6, "Or": 3, "Diamant": 2, "Officiel": 1 };

var _toutes = [];
var _filtreActuel = "tous";

function revelerAcces() {
  document.getElementById("page404").style.display = "none";
  document.getElementById("gate").style.display = "flex";
}

document.getElementById("gatePwd").addEventListener("keypress", function(e) {
  if (e.key === "Enter") verifierMotDePasse();
});

if (sessionStorage.getItem("app_state_9f") === "1") {
  document.getElementById("page404").style.display = "none";
  document.getElementById("gate").style.display = "none";
  document.getElementById("contenuAdmin").style.display = "block";
  chargerCandidatures();
}

function verifierMotDePasse() {
  var val = document.getElementById("gatePwd").value;
  if (val === ADMIN_PWD) {
    document.getElementById("gate").style.display = "none";
    document.getElementById("contenuAdmin").style.display = "block";
    sessionStorage.setItem("app_state_9f", "1");
    chargerCandidatures();
  } else {
    document.getElementById("gateErr").style.display = "block";
  }
}

async function chargerCandidatures() {
  var r = await _supabase.from("lokt_sponsors").select("*").order("created_at", { ascending: false });
  if (r.error) {
    document.getElementById("listeCandidatures").innerHTML = '<div class="empty">Erreur de chargement : ' + r.error.message + '</div>';
    return;
  }
  _toutes = r.data || [];
  afficherStats();
  afficherListe();
  chargerCodes();
}

function afficherStats() {
  var counts = { nouveau: 0, contacte: 0, valide: 0, refuse: 0 };
  _toutes.forEach(function(c) {
    var s = c.statut || "nouveau";
    if (counts[s] !== undefined) counts[s]++;
  });
  var el = document.getElementById("statsRow");
  el.innerHTML = [
    { l: "Total", n: _toutes.length },
    { l: "Nouveau", n: counts.nouveau },
    { l: "Contacté", n: counts.contacte },
    { l: "Validé", n: counts.valide },
    { l: "Refusé", n: counts.refuse }
  ].map(function(s) {
    return '<div class="stat-card"><div class="n">' + s.n + '</div><div class="l">' + s.l + '</div></div>';
  }).join("");

  document.querySelectorAll(".tab").forEach(function(t) {
    var s = t.dataset.statut;
    var badge = t.querySelector(".badge");
    if (badge) badge.remove();
    if (s !== "tous" && counts[s] > 0) {
      t.innerHTML += ' <span class="badge">' + counts[s] + '</span>';
    }
  });
}

function filtrer(statut) {
  _filtreActuel = statut;
  document.querySelectorAll(".tab").forEach(function(t) {
    t.classList.toggle("active", t.dataset.statut === statut);
  });
  afficherListe();
}

var LABELS_STATUT = { nouveau: "Nouveau", contacte: "Contacté", valide: "Validé", refuse: "Refusé" };

function afficherListe() {
  var el = document.getElementById("listeCandidatures");
  var liste = _toutes;
  if (_filtreActuel !== "tous") {
    liste = _toutes.filter(function(c) { return (c.statut || "nouveau") === _filtreActuel; });
  }
  if (!liste.length) { el.innerHTML = '<div class="empty">Aucune candidature dans cette catégorie.</div>'; return; }

  el.innerHTML = liste.map(function(c) {
    var statut = c.statut || "nouveau";
    var logoHtml = (c.photos && c.photos.length) ? '<img class="logo-preview" src="' + c.photos[0] + '">' : '';
    var dureeTxt = c.duree_mois ? c.duree_mois + " mois" : "—";
    var periodeTxt = "";
    if (statut === "valide" && c.date_fin) {
      periodeTxt = '<div style="font-size:12px;color:var(--green);margin-bottom:8px">Actif jusqu\'au ' + new Date(c.date_fin).toLocaleDateString("fr-FR") + '</div>';
    }
    return '<div class="card">' +
      logoHtml +
      '<div class="card-top">' +
        '<h3>' + c.entreprise + '</h3>' +
        '<span class="badge-statut st-' + statut + '">' + LABELS_STATUT[statut] + '</span>' +
      '</div>' +
      '<div class="info-grid">' +
        '<div><b>Formule</b>' + (c.formule || "—") + '</div>' +
        '<div><b>Durée demandée</b>' + dureeTxt + '</div>' +
        '<div><b>Secteur</b>' + (c.secteur || "—") + '</div>' +
        '<div><b>Localisation</b>' + [c.ville, c.pays].filter(Boolean).join(", ") + '</div>' +
        '<div><b>Contact</b>' + c.contact_nom + '</div>' +
        '<div><b>Téléphone</b>' + c.telephone + '</div>' +
        '<div><b>Email</b>' + c.email + '</div>' +
        '<div><b>Budget indiqué</b>' + (c.budget || "—") + '</div>' +
      '</div>' +
      periodeTxt +
      (c.message ? '<div class="msg-box">' + c.message + '</div>' : '') +
      (c.site_web ? '<a href="' + c.site_web + '" target="_blank" style="font-size:12px;color:var(--orange2)">🔗 Site web</a><br>' : '') +
      (c.lien_video ? '<a href="' + c.lien_video + '" target="_blank" style="font-size:12px;color:var(--orange2)">🎬 Lien vidéo</a>' : '') +
      '<div class="action-row" style="margin-top:12px">' +
        (statut !== "contacte" && statut !== "valide" ? '<button class="btn btn-contact" onclick="changerStatut(\'' + c.id + '\',\'contacte\')">Marquer contacté</button>' : '') +
        (statut !== "valide" ? '<button class="btn btn-valider" onclick="validerSponsor(\'' + c.id + '\',\'' + c.formule + '\',' + (c.duree_mois || 1) + ')">✅ Valider (paiement reçu)</button>' : '') +
        (statut !== "refuse" ? '<button class="btn btn-refuser" onclick="changerStatut(\'' + c.id + '\',\'refuse\')">Refuser</button>' : '') +
        (statut === "valide" || statut === "refuse" ? '<button class="btn btn-reset" onclick="changerStatut(\'' + c.id + '\',\'nouveau\')">Remettre en attente</button>' : '') +
      '</div>' +
      '<div id="limite-' + c.id + '"></div>' +
    '</div>';
  }).join("");
}

function genererCodeAleatoire() {
  var alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var code = "";
  for (var i = 0; i < 10; i++) code += alphabet[Math.floor(Math.random() * alphabet.length)];
  return code;
}

async function genererCode() {
  var cible = document.getElementById("cibleCode").value.trim();
  var code = genererCodeAleatoire();
  var r = await _supabase.from("lokt_codes_sponsors").insert({ code: code, cible: cible || null }).select().single();
  if (r.error) { alert("Erreur : " + r.error.message); return; }
  document.getElementById("cibleCode").value = "";
  await chargerCodes();
  prompt("Code généré — copie-le pour l'envoyer :", code);
}

async function chargerCodes() {
  var el = document.getElementById("listeCodes");
  var r = await _supabase.from("lokt_codes_sponsors").select("*").order("created_at", { ascending: false }).limit(30);
  if (r.error || !r.data || !r.data.length) { el.innerHTML = '<div class="empty">Aucun code généré pour le moment.</div>'; return; }
  el.innerHTML = r.data.map(function(c) {
    var badge = c.statut === "utilise" ? '<span class="badge-statut st-refuse">Utilisé</span>' : '<span class="badge-statut st-valide">Actif</span>';
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px">' +
      '<div><b style="font-family:monospace;letter-spacing:1px">' + c.code + '</b>' + (c.cible ? ' — ' + c.cible : '') + '</div>' +
      badge +
      '</div>';
  }).join("");
}

async function envoyerRecuEmail(sponsor, statut, lienFacture) {
  try {
    await fetch(SUPA_URL + "/functions/v1/sponsor-receipt-email", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPA_KEY },
      body: JSON.stringify({
        email: sponsor.email,
        entreprise: sponsor.entreprise,
        formule: sponsor.formule,
        duree_mois: sponsor.duree_mois,
        statut: statut,
        date_debut: sponsor.date_debut,
        date_fin: sponsor.date_fin,
        lien_facture: lienFacture || null
      })
    });
  } catch(e) {}
}

var PLANS_TARIFS = {
  "Bronze":   { multiplicateur: 50,  plancher: 25000 },
  "Argent":   { multiplicateur: 120, plancher: 75000 },
  "Or":       { multiplicateur: 250, plancher: 150000 },
  "Diamant":  { multiplicateur: 450, plancher: 300000 },
  "Officiel": { multiplicateur: 800, plancher: 600000 }
};

async function getNombreUtilisateurs() {
  var sources = ["profiles", "users", "lokt_talents"];
  for (var i = 0; i < sources.length; i++) {
    try {
      var r = await _supabase.from(sources[i]).select("*", { count: "exact", head: true });
      if (r && typeof r.count === "number" && r.count > 0) return r.count;
    } catch(e) {}
  }
  return 50;
}

async function calculerPrixSponsor(formule) {
  var plan = PLANS_TARIFS[formule];
  if (!plan) return 0;
  var nbUtilisateurs = await getNombreUtilisateurs();
  var brut = nbUtilisateurs * plan.multiplicateur;
  var arrondi = Math.round(brut / 5000) * 5000;
  return Math.max(plan.plancher, arrondi);
}

async function creerFactureSponsor(sponsor, prix) {
  var numRes = await _supabase.rpc("lokali_generer_numero_document", { p_type: "facture" });
  var numero = numRes.data || "FAC-" + Date.now();

  var payload = {
    user_id: null,
    numero: numero,
    type_document: "facture",
    emetteur_nom: "KORANDIS TECH",
    emetteur_activite: "Plateforme LOKALI",
    emetteur_ville: "Abidjan",
    client_nom: sponsor.entreprise,
    client_telephone: sponsor.telephone,
    client_email: sponsor.email,
    client_adresse: [sponsor.ville, sponsor.pays].filter(Boolean).join(", "),
    lignes: [{
      designation: "Sponsoring LOKALI — Formule " + sponsor.formule + " (" + sponsor.duree_mois + " mois)",
      quantite: 1,
      prix_unitaire: prix
    }],
    remise_pourcentage: 0,
    conditions_paiement: "Paiement reçu avant activation",
    notes: "Facture générée automatiquement à la validation du partenariat sponsor."
  };

  var r = await _supabase.from("lokt_devis_facture").insert(payload).select().single();
  if (r.error) return null;
  return r.data.id;
}

function demanderReconfirmation() {
  var val = prompt("Confirme le code d'accès pour valider :");
  return val === ADMIN_PWD;
}

async function changerStatut(id, statut) {
  if (!demanderReconfirmation()) { alert("Code incorrect, action annulée."); return; }
  var payload = { statut: statut };
  if (statut !== "valide") { payload.date_debut = null; payload.date_fin = null; }
  var r = await _supabase.from("lokt_sponsors").update(payload).eq("id", id);
  if (r.error) { alert("Erreur : " + r.error.message); return; }

  if (statut === "refuse") {
    var sponsor = _toutes.find(function(c){ return c.id === id; });
    if (sponsor) envoyerRecuEmail(sponsor, "refuse");
  }
  await chargerCandidatures();
}

async function validerSponsor(id, formule, dureeMois) {
  if (!demanderReconfirmation()) { alert("Code incorrect, action annulée."); return; }

  var limite = LIMITES[formule];
  if (limite !== undefined) {
    var actifsCount = _toutes.filter(function(c) {
      return c.formule === formule && c.statut === "valide" && c.id !== id &&
        (!c.date_fin || new Date(c.date_fin) > new Date());
    }).length;
    if (actifsCount >= limite) {
      var zone = document.getElementById("limite-" + id);
      if (zone) zone.innerHTML = '<div class="limite-alert">⚠️ Toutes les places "' + formule + '" sont déjà occupées (' + limite + '/' + limite + '). Refuse un sponsor existant avant de valider celui-ci, ou choisis une autre formule.</div>';
      return;
    }
  }

  var maintenant = new Date();
  var dateFin = new Date(maintenant);
  dateFin.setMonth(dateFin.getMonth() + parseInt(dureeMois || 1));

  var r = await _supabase.from("lokt_sponsors").update({
    statut: "valide",
    date_debut: maintenant.toISOString(),
    date_fin: dateFin.toISOString()
  }).eq("id", id);

  if (r.error) { alert("Erreur : " + r.error.message); return; }

  var sponsor = _toutes.find(function(c){ return c.id === id; });
  if (sponsor) {
    sponsor.date_debut = maintenant.toISOString();
    sponsor.date_fin = dateFin.toISOString();

    var prix = await calculerPrixSponsor(formule);
    var factureId = await creerFactureSponsor(sponsor, prix);
    var lienFacture = factureId ? (window.location.origin + "/lokali-devis-facture.html?voir=" + factureId) : null;

    envoyerRecuEmail(sponsor, "valide", lienFacture);
  }

  await chargerCandidatures();
}
</script>
</body>
</html>
